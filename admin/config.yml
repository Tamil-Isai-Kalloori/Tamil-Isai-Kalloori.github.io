      fields: &gallery_ta_fields
        - *f_title
        - *f_key
        - *f_url
        - *f_weight
        - *f_draft
        - *f_desc
        - *f_layout
        - *f_hero
        - label: "Albums"
          name: albums
          widget: list
          required: false
          summary: "{{fields.title}}"
          hint: "Only the title and the images are displayed. Slug and description are stored but not shown."
          fields:
            - { label: "Title", name: title, widget: string }
            - { label: "Slug", name: slug, widget: string, hint: "Lower-case, hyphens, e.g. carnatic-vocal-concerts" }
            - { label: "Description", name: description, widget: text, required: false }
            - *f_images
        - *f_body
    - name: gallery_en
      label: "Gallery — English"
      file: gallery/_index.en.md
      fields: *gallery_ta_fields
    - name: media_ta
      label: "Media coverage — Tamil (தமிழ்)"
      file: media/_index.ta.md
      fields: &media_ta_fields
        - *f_title
        - *f_key
        - *f_url
        - *f_weight
        - *f_draft
        - *f_desc
        - *f_layout
        - *f_hero
        - label: "Media clips"
          name: clips
          widget: list
          required: false
          summary: "{{fields.source}} — {{fields.headline}}"
          fields:
            - { label: "Source", name: source, widget: string }
            - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
            - { label: "Type", name: type, widget: select, options: [print, broadcast] }
            - { label: "Headline", name: headline, widget: string, required: false }
            - { label: "Link", name: link, widget: string, required: false }
            - { label: "File format", name: format, widget: string, required: false, hint: "e.g. pdf" }
        - *f_body
    - name: media_en
      label: "Media coverage — English"
      file: media/_index.en.md
      fields: *media_ta_fields
    - name: news_page_ta
      label: "News page — Tamil (தமிழ்)"
      file: news/_index.ta.md
      fields: &news_page_ta_fields
        - *f_title
        - *f_key
        - *f_url
        - *f_weight
        - *f_draft
        - *f_desc
        - *f_body
    - name: news_page_en
      label: "News page — English"
