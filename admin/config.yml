        - *f_key
        - *f_weight
        - *f_draft
        - *f_desc
        - *f_layout
        - *f_images
        - label: "Home page sections"
          name: sections
          widget: object
          required: false
          hint: "Heading and intro for each block of the home page."
          fields:
            - label: "Statement"
              name: statement
              widget: object
              required: false
              fields:
                - { label: "Heading", name: heading, widget: string, required: false }
                - { label: "Intro", name: intro, widget: text, required: false }
            - label: "Courses"
              name: courses
              widget: object
              required: false
