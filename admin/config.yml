  # ======== Navigation ========
  - name: navigation
    label: "Navigation"
    delete: false
    editor:
      preview: false
    files:
    - name: navbar_ta
      label: "Site menu — Tamil (தமிழ்)"
      file: navbar/navbar.ta.md
      fields: &navbar_ta_fields
        - { name: title, widget: hidden, required: false }
        - *f_key
        - { name: weight, widget: hidden, required: false }
        - *f_draft
        - { name: description, widget: hidden, required: false }
        - { label: "Logo", name: logo, widget: image, required: false }
        - label: "Menu items"
          name: menu
          widget: list
          required: false
          summary: "{{fields.name}}"
          hint: "The header shows only items with weight 2-6; the Admissions item (cta) is drawn as the button. Reordering weights changes the header."
          fields:
            - { label: "Name", name: name, widget: string }
            - { label: "Link", name: url, widget: string, hint: "Tamil menu: /about/ — English menu: /en/about/" }
            - { label: "Weight", name: weight, widget: number, value_type: int }
            - { label: "Show as button", name: cta, widget: boolean, required: false, default: false }
            - label: "Sub-menu"
              name: children
              widget: list
              required: false
              summary: "{{fields.name}}"
              fields:
                - { label: "Name", name: name, widget: string }
                - { label: "Link", name: url, widget: string }
                - { label: "Weight", name: weight, widget: number, value_type: int }
    - name: navbar_en
      label: "Site menu — English"
      file: navbar/navbar.en.md
      fields: *navbar_ta_fields

  # ======== Data tables (data/*.yaml) ========
  # Not per-locale: one file serves both languages, so bilingual values are
  # separate fields (name_ta / name_en). Saving drops the explanatory comments
  # at the top of each YAML file; the data itself is unchanged.
  - name: site_data
    label: "Data tables"
    delete: false
    i18n: false
    editor:
      preview: false
    files:
      - name: data_awards
        label: "Awards (Isai Perarignar & Pann Isai Arignar)"
        file: data/awards.yaml
        format: yaml
        fields:
          - label: "Isai Perarignar awardees"
            name: isai_per_arignar
            widget: list
            summary: "{{fields.year}} — {{fields.name_en}}"
            fields: &award_fields
              - { label: "Year", name: year, widget: number, value_type: int }
              - { label: "Name (Tamil)", name: name_ta, widget: string }
              - { label: "Name (English)", name: name_en, widget: string, required: false }
          - label: "Pann Isai Arignar awardees"
            name: pann_isai_arignar
            widget: list
            summary: "{{fields.year}} — {{fields.name_en}}"
            fields: *award_fields
      - name: data_chief_guests
        label: "Chief guests"
        file: data/chief_guests.yaml
        format: yaml
        fields:
          - label: "Chief guests"
            name: chief_guests
            widget: list
            summary: "{{fields.year}} — {{fields.name_en}}"
            fields:
              - { label: "Year", name: year, widget: string, hint: "Text, because some are ranges: 1943 - 1944" }
              - { label: "Name (Tamil)", name: name_ta, widget: string }
              - { label: "Name (English)", name: name_en, widget: string, required: false }
      - name: data_panns
        label: "Panns and ragams"
        file: data/panns.yaml
        format: yaml
        fields:
          - label: "Pann / ragam pairs"
            name: panns
            widget: list
            summary: "{{fields.pann_ta}} — {{fields.ragam_ta}}"
            fields:
              - { label: "Pann (Tamil)", name: pann_ta, widget: string }
              - { label: "Ragam (Tamil)", name: ragam_ta, widget: string }
              - { label: "Pann (English)", name: pann_en, widget: string, required: false }
              - { label: "Ragam (English)", name: ragam_en, widget: string, required: false }
      - name: data_presidents
        label: "Presidents"
        file: data/presidents.yaml
        format: yaml
        fields:
          - label: "Presidents"
            name: presidents
            widget: list
            summary: "{{fields.year_from}} — {{fields.name_en}}"
            fields:
              - { label: "From year", name: year_from, widget: number, value_type: int }
              - { label: "To year", name: year_to, widget: number, value_type: int, required: false, hint: "Leave empty for the current president." }
              - { label: "Name (Tamil)", name: name_ta, widget: string }
              - { label: "Name (English)", name: name_en, widget: string, required: false }
      - name: data_courses
        label: "Courses"
        file: data/courses.yaml
        format: yaml
        fields:
          - label: "Courses"
            name: courses
            widget: list
            summary: "{{fields.title_en}}"
            fields:
              - { label: "Id", name: id, widget: string, hint: "Short unique code, e.g. ma-music-vocal. Do not change for existing courses." }
              - { label: "Title (Tamil)", name: title_ta, widget: string }
              - { label: "Title (English)", name: title_en, widget: string }
              - { label: "Type", name: type, widget: select, options: [day, evening, grade_exam, online, distance], hint: "Decides which course list the course appears in." }
              - { label: "Duration", name: duration, widget: string, required: false }
              - { label: "Eligibility (Tamil)", name: eligibility_ta, widget: text, required: false }
              - { label: "Eligibility (English)", name: eligibility_en, widget: text, required: false }
              - { label: "College", name: college, widget: select, options: [day, evening, tisgec, online, distance] }
              - { label: "Affiliation", name: affiliation, widget: string, required: false }
