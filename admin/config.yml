################################################################################
# Decap CMS Configuration — Tamil Isai Kalloori
#
# Backend: GitHub repo (hugo-content submodule, mounted into Hugo as content/)
# Auth: PKCE flow via client.html (no external OAuth server needed)
# Multilingual: Tamil (ta) default + English (en)
#
# For local development, uncomment `local_backend: true` and run:
#   npx decap-server
#
# WHAT THIS FILE EDITS
#   Every `file:` and `folder:` below is a path inside the CONTENT repo
#   (hugo-content-main), and every one of them exists. Each page is edited as two
#   separate entries, one per language file (_index.ta.md and _index.en.md).
#
# WHY NOT i18n `multiple_files` FOR PAGES?
#   Decap refuses it: for `files` collections only `single_file` i18n is
#   allowed (config load fails with "i18n configuration for files collections is
#   limited to single_file structure"). Folder collections would allow it, but
#   would force one field list on pages with different shapes. So pages are
#   plain per-locale files, and the root `i18n` block below is kept only to
#   document the site's locales. Nothing in it is applied to a collection.
#
# NOT EDITABLE HERE, ON PURPOSE
#   * Site settings (data/settings.yaml). That file lives in the BUILDER repo
#     (hugo-builder-main/data/), and this CMS backend can only write to the
#     content repo. A collection pointing at it would save to a new orphan file
#     that nothing reads, so there is none. Contact details are changed in the
#     builder repo until settings.yaml moves into the content repo.
#   * top_bar/top_bar.*.md. No template reads it any more.
#   * translationKey, layout, url, draft: hidden fields (see field_library).
################################################################################

# local_backend: true

# CMS interface language
locale: en

# Editorial workflow — gives staff draft -> in review -> ready -> publish
publish_mode: editorial_workflow

# --------------------------------------------------------------------------
# Backend — GitHub with PKCE auth
#
# PRODUCTION SETUP REQUIRED:
# 1. Register a GitHub OAuth App for tamilisaisangam.in
# 2. Set the OAuth callback URL to https://tamilisaisangam.in/admin/client.html
# 3. The client.html file handles the PKCE flow — no server needed
# --------------------------------------------------------------------------
backend:
  name: github
  repo: Tamil-Isai-Kalloori/hugo-content
  branch: main
  site_domain: tamil-isai-kalloori.github.io
  # PKCE auth — client.html in /admin/ handles the OAuth redirect.
  # base_url is required: without it Decap sends the login to api.netlify.com.
  # When the site moves to tamilisaisangam.in, change both lines above/below
  # and the GitHub OAuth App callback URL to https://tamilisaisangam.in/admin/client.html
  base_url: https://tamil-isai-kalloori.github.io
  auth_endpoint: /admin/client.html

# --------------------------------------------------------------------------
# Media — uploads go to /uploads/ in the content repo
# --------------------------------------------------------------------------
media_folder: "/uploads"
public_folder: "/uploads"

# --------------------------------------------------------------------------
# Site locales (documentation only, see note at the top of this file)
# --------------------------------------------------------------------------
i18n:
  structure: multiple_files
  locales: [ta, en]
  default_locale: ta


field_library:
  title: &f_title { label: "Title", name: title, widget: string }
  description: &f_desc { label: "Description (search / social summary)", name: description, widget: string }
  weight: &f_weight { label: "Sort order (weight)", name: weight, widget: number, value_type: int, hint: "Lower numbers come first in menus and section listings." }
  body: &f_body { label: "Page text", name: body, widget: markdown }
  hero: &f_hero { label: "Hero image", name: hero_image, widget: image, required: false }
  # Never editable by staff: changing these would break the ta/en pairing, the
  # template binding or the page address. Hidden widgets keep the stored value.
  translationKey: &f_key { name: translationKey, widget: hidden, required: false }
  layout: &f_layout { name: layout, widget: hidden, required: false }
  url: &f_url { name: url, widget: hidden, required: false }
  draft: &f_draft { name: draft, widget: hidden, required: false }
  images: &f_images
    label: "Images"
    name: images
    widget: list
    required: false
    summary: "{{fields.caption}}"
    hint: "The caption is also the image's alt text."
    fields:
      - { label: "Image", name: src, widget: image }
      - { label: "Caption", name: caption, widget: string }
  person_fields: &f_person_fields
    - { label: "Name", name: name, widget: string }
    - { label: "Role", name: role, widget: string, required: false }
    - { label: "Photo", name: photo, widget: image, required: false }
    - { label: "Tenure", name: tenure, widget: string, required: false, hint: "For example 1943 - 1948" }

