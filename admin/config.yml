  # ======== Events ========
  # Section pages: the hub plus the Upcoming / Past list pages. The list pages
  # have no body text of their own beyond the short intro; the lists are built
  # from the event entries in the collection below.
  - name: events_pages
    label: "Events — section pages"
    delete: false
    files:
      - name: events_page_ta
        label: "Events hub — Tamil (தமிழ்)"
        file: events/_index.ta.md
        fields: &events_page_fields
          - *f_title
          - *f_key
          - *f_url
          - *f_weight
          - *f_draft
          - *f_desc
          - *f_body
      - name: events_page_en
        label: "Events hub — English"
        file: events/_index.en.md
        fields: *events_page_fields
      - name: events_upcoming_ta
        label: "Upcoming events page — Tamil (தமிழ்)"
        file: events/upcoming/_index.ta.md
        fields: &events_list_page_fields
          - *f_title
          - *f_key
          - *f_url
          - *f_weight
          - *f_draft
          - *f_desc
          - *f_layout
          - { name: outputs, widget: hidden, required: false }
          - *f_body
      - name: events_upcoming_en
        label: "Upcoming events page — English"
        file: events/upcoming/_index.en.md
        fields: *events_list_page_fields
      - name: events_past_ta
        label: "Past events page — Tamil (தமிழ்)"
        file: events/past/_index.ta.md
        fields: *events_list_page_fields
      - name: events_past_en
        label: "Past events page — English"
        file: events/past/_index.en.md
        fields: *events_list_page_fields

  # One entry per event. Tamil and English are saved as a pair of files
  # (events/<slug>.ta.md + events/<slug>.en.md). Fields marked `i18n: true` are
  # written in each language; `i18n: duplicate` fields are copied into both
  # files, so the two halves always carry the same dates and category.
  # Upcoming / Past is NOT a field: the site decides from event_start / event_end
  # when it is built, and a daily rebuild moves finished events across.
  - name: events
    label: "Events"
    label_singular: "Event"
    folder: events
    create: true
    delete: true
    extension: md
    format: frontmatter
    # Filename comes from the "Web address" field below (plain ASCII), so the
    # Tamil and English files share one name: <web-address>.ta.md / .en.md.
    path: "{{slug}}"
    slug: "{{fields.slug}}"
    # Only event entries; the _index section pages in the same folder have no
    # entry_type and are edited in "Events — section pages" above.
    filter: { field: entry_type, value: event }
    i18n: true
    summary: "{{event_start | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: [event_start, title, date]
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - { label: "Web address", name: slug, widget: string, i18n: duplicate, pattern: ["^[a-z0-9-]+$", "Lowercase English letters, digits and hyphens only"],
          hint: "Used in the page address and file name, e.g. pann-isai-recital-2026-12. Do not change it after the event is published." }
      - { name: translationKey, widget: hidden, required: false, i18n: duplicate }
      - { name: entry_type, widget: hidden, default: event, i18n: duplicate }
      - { name: outputs, widget: hidden, default: [html, calendar], i18n: duplicate }
      - { name: url, widget: hidden, required: false, i18n: true }
      - { name: draft, widget: hidden, required: false, default: false, i18n: duplicate }
      - { label: "Announcement date", name: date, widget: datetime, i18n: duplicate,
          date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD",
          hint: "The day the event is announced on the site (today or earlier). This is NOT the event date: a date in the future hides the page. The event's own date is set below." }
      - { label: "Starts", name: event_start, widget: datetime, i18n: duplicate,
          date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ", picker_utc: false,
          hint: "Date and time in Indian Standard Time (+05:30). For all-day events the time is ignored." }
      - { label: "Ends", name: event_end, widget: datetime, i18n: duplicate, required: false,
          date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ", picker_utc: false,
          hint: "Leave empty for a single-session event. Multi-day events: the last day." }
      - { label: "All-day / multi-day (no set times)", name: all_day, widget: boolean, default: false, required: false, i18n: duplicate }
      - label: "Category"
        name: category
        widget: select
        i18n: duplicate
        options:
          - { label: "Festival", value: festival }
          - { label: "Concert", value: concert }
          - { label: "Conference", value: conference }
          - { label: "Competition", value: competition }
          - { label: "Ceremony", value: ceremony }
          - { label: "Workshop", value: workshop }
          - { label: "Exhibition", value: exhibition }
      - { label: "Venue", name: venue, widget: string, i18n: true }
      - { label: "Address", name: address, widget: string, required: false, i18n: true }
      - { label: "Image", name: image, widget: image, required: false, i18n: duplicate, hint: "A photograph of music or the venue. Do not use portraits or manuscripts." }
      - { label: "Summary", name: summary, widget: string, i18n: true, hint: "One sentence, shown in the event lists." }
      - { label: "Registration link", name: registration_url, widget: string, required: false, i18n: true }
      - { label: "Registration deadline", name: registration_deadline, widget: datetime, required: false, i18n: duplicate,
          date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Fee", name: fee, widget: string, required: false, i18n: true, hint: "For example: Free entry, or Rs. 150." }
      - { label: "Sample record", name: sample, widget: boolean, default: false, required: false, i18n: duplicate,
          hint: "Switch ON only for placeholder events. Real events must leave this OFF." }
      - { label: "Description", name: body, widget: markdown, i18n: true }

