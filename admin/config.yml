              required: false
              fields:
                - { label: "Heading", name: heading, widget: string, required: false }
                - { label: "Intro", name: intro, widget: text, required: false }
        - *f_body
    - name: home_page_en
      label: "Home page text — English"
      file: _index.en.md
      fields: *home_page_ta_fields
    - name: home_slider_ta
      label: "Home slider — Tamil (தமிழ்)"
